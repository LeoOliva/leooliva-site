server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /en { try_files /index.html =404; }
    location = /es { try_files /index.html =404; }
    location = /en/ { try_files /index.html =404; }
    location = /es/ { try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
}
